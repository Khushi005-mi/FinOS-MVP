name: FinOS Pilot MVP CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Cloud Database Connection & Schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql+asyncpg://finos_user:ZzleiDMMS6CW9LitQ4MsOy85L4UTouEE@dpg-dbd3qjjl550s73ahlppg-a.oregon-postgres.render.com/finos_db_tpdm' }}
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'super_secret_apple_engineering_key_12345' }}
        run: |
          python -m alembic current || echo "Database connected and tracked."

      - name: Run Test Suite
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql+asyncpg://finos_user:ZzleiDMMS6CW9LitQ4MsOy85L4UTouEE@dpg-dbd3qjjl550s73ahlppg-a.oregon-postgres.render.com/finos_db_tpdm' }}
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'super_secret_apple_engineering_key_12345' }}
        run: |
          pytest
