services:
  - type: web
    name: finos-backend
    env: docker
    region: oregon
    plan: free
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: finos-frontend
    env: node
    region: oregon
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    rootDir: frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: finos-backend
          property: url
          transform: "https://{host}/api/v1"
